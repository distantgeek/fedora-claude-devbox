[defaults]
inventory               = inventory.ini
host_key_checking       = False
timeout                 = 30
gather_facts            = True
fact_caching            = memory
fact_caching_timeout    = 3600

stdout_callback         = default
display_skipped_hosts   = False
display_ok_hosts        = True

log_path                = deployment.log

forks                   = 4
poll_interval           = 15

# Default to unprivileged — tasks use become: true individually
become                  = False
become_method           = sudo

roles_path              = ansible/roles

[ssh_connection]
ssh_args                = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=3
control_path            = ~/.ssh/ansible-%r@%h:%p
pipelining              = True
retries                 = 3

[inventory]
enable_plugins          = yaml, ini, auto
