[defaults]
# No default inventory — the Makefile always passes -i <host>, (inline).
host_key_checking       = False
timeout                 = 30
gather_facts            = True
fact_caching            = memory
fact_caching_timeout    = 3600

# Fedora 44 ships Python 3.14 — ansible-core 2.21 interpreter discovery fails
# against it ("not enough arguments for format string"). Pin the interpreter.
interpreter_python      = /usr/bin/python3

stdout_callback         = default
display_skipped_hosts   = False
display_ok_hosts        = True

# Paths below are relative to THIS file's directory (ansible/).
log_path                = deployment.log

forks                   = 4
poll_interval           = 15

# Default to unprivileged — tasks use become: true individually
become                  = False
become_method           = sudo

roles_path              = roles

[ssh_connection]
ssh_args                = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=3
# %% escapes: ansible-core does `control_path % dict(directory=...)`, so %r/%h/%p
# must be doubled to survive Python formatting and reach ssh's own substitution.
control_path            = ~/.ssh/ansible-%%r@%%h:%%p
pipelining              = True
retries                 = 3
# No tty: util-linux `su` emits OSC 8 session-tracking sequences on a pty,
# which pollute module output ("junk after the JSON data"). Key auth + `su -`
# need no password prompt, so a tty is unnecessary.
usetty                  = False

[inventory]
# host_list is required for inline `-i host,` inventories (used by the Makefile)
enable_plugins          = host_list, yaml, ini, auto
