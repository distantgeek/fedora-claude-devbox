---
# Thin post-boot configuration for open-atomic.
# Run after the bootc image is deployed and the VM has first-booted.
# Does NOT rebuild the image — only configures runtime user state.
#
# Usage: make deploy VM_HOST=192.168.x.x

- name: Configure open-atomic
  hosts: all
  gather_facts: true

  vars:
    target_user: "{{ ansible_user | default('devbox') }}"
    target_user_home: "/home/{{ target_user }}"
    manage_git_repositories: "{{ lookup('env', 'MANAGE_GIT_REPOSITORIES') | default('false', true) | bool }}"

  pre_tasks:
    - name: Display deployment info
      ansible.builtin.debug:
        msg: |
          ── open-atomic configure ──
          Host  : {{ inventory_hostname }}
          User  : {{ target_user }}
          OS    : {{ ansible_distribution }} {{ ansible_distribution_version }}
          Date  : {{ ansible_date_time.date }}

  roles:
    - role: common
    - role: git
    - role: git-repos
      when: manage_git_repositories | bool
    - role: opencode-config

  post_tasks:
    - name: Relabel agent volume dirs for SELinux (container_file_t:s0)
      ansible.builtin.command: chcon -R -t container_file_t -l s0 {{ item }}
      become: true
      changed_when: false
      loop:
        - "{{ target_user_home }}/.local"
        - "{{ target_user_home }}/.config/opencode/sessions"
        - "{{ target_user_home }}/repos"
      # Rootless podman cannot reliably re-relabel with :Z (MCS category
      # mismatch). chcon to container_file_t:s0 (no categories) + plain :rw
      # mounts in the Quadlet is the deterministic fix.
      when: ansible_user == 'root'

    - name: Deployment complete
      ansible.builtin.debug:
        msg: |
          ── Configuration complete ──
          Run validate : make validate VM_HOST={{ inventory_hostname }}
