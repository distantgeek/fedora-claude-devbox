---
# Optional Kubernetes layer for open-atomic.
# Installs kubectl, helm, and k3s or KIND on a running devbox.
# Does NOT rebuild the bootc image — additive only.
#
# Usage: make enable-kubernetes VM_HOST=192.168.x.x [K8S_BACKEND=k3s|kind]

- name: Install Kubernetes tooling on open-atomic
  hosts: all
  gather_facts: true

  vars:
    target_user: "{{ ansible_user | default('devbox') }}"
    target_user_home: "/home/{{ target_user }}"
    kubernetes_backend: "{{ lookup('env', 'K8S_BACKEND') | default('k3s', true) }}"

  pre_tasks:
    - name: Display Kubernetes install info
      ansible.builtin.debug:
        msg: |
          ── open-atomic kubernetes ──
          Host    : {{ inventory_hostname }}
          Backend : {{ kubernetes_backend }}
          Date    : {{ ansible_date_time.date }}

  roles:
    - role: kubernetes

  post_tasks:
    - name: Kubernetes install complete
      ansible.builtin.debug:
        msg: |
          ── Kubernetes ({{ kubernetes_backend }}) installed ──
          kubectl  : run `kubectl version --client`
          helm     : run `helm version`
