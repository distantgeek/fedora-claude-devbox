---
# Post-deployment validation for open-atomic.
# Verifies the devbox is correctly configured after make deploy.
#
# Usage: make validate VM_HOST=192.168.x.x VM_USER=root TARGET_USER=kevbot
#
# System-level checks run as root (become: true). User/container-level checks
# run as the target user via `su -` (login shell → pam_systemd sets
# XDG_RUNTIME_DIR, required for rootless podman). opencode and the toolchains
# live in the agent container, so those checks use `podman exec`.

- name: Validate open-atomic deployment
  hosts: all
  gather_facts: true

  vars:
    target_user: "{{ ansible_user | default('devbox') }}"
    target_user_home: "/home/{{ target_user }}"
    agent_container: opencode-agent

  tasks:
    # ── bootc ──────────────────────────────────────────────────────────────
    - name: Check bootc status
      ansible.builtin.command: bootc status
      register: bootc_status
      changed_when: false
      become: true

    - name: Display bootc status
      ansible.builtin.debug:
        msg: "{{ bootc_status.stdout_lines[:5] }}"

    # ── Podman (rootless, as target user) ─────────────────────────────────
    - name: Check Podman version
      ansible.builtin.command: podman --version
      register: podman_version
      changed_when: false
      become: true
      become_user: "{{ target_user }}"
      become_method: su
      become_flags: "-"

    - name: Verify rootless Podman SELinux status
      ansible.builtin.command: podman info --format '{{ "{{" }}.Host.Security.SELinuxEnabled{{ "}}" }}'
      register: podman_selinux
      changed_when: false
      become: true
      become_user: "{{ target_user }}"
      become_method: su
      become_flags: "-"

    # ── Agent container ───────────────────────────────────────────────────
    - name: Check agent container is running
      ansible.builtin.command: podman ps --filter name={{ agent_container }} --format '{{ "{{" }}.Status{{ "}}" }}'
      register: agent_container_status
      changed_when: false
      become: true
      become_user: "{{ target_user }}"
      become_method: su
      become_flags: "-"

    - name: Assert agent container is running
      ansible.builtin.assert:
        that: agent_container_status.stdout | length > 0
        fail_msg: "Agent container {{ agent_container }} is not running"
        success_msg: "Agent container {{ agent_container }} is running."

    # ── OpenCode (inside the container) ───────────────────────────────────
    - name: Check OpenCode version
      ansible.builtin.command: podman exec {{ agent_container }} opencode --version
      register: opencode_version
      changed_when: false
      become: true
      become_user: "{{ target_user }}"
      become_method: su
      become_flags: "-"

    # ── Framework (immutable layers, inside the container) ────────────────
    - name: Check managed config exists (in container)
      ansible.builtin.command: podman exec {{ agent_container }} test -f /etc/opencode/opencode.json
      register: managed_config
      changed_when: false
      failed_when: false
      become: true
      become_user: "{{ target_user }}"
      become_method: su
      become_flags: "-"

    - name: Assert managed config is present
      ansible.builtin.assert:
        that: managed_config.rc == 0
        fail_msg: "Managed config missing at /etc/opencode/opencode.json (in container)"
        success_msg: "Managed config present."

    - name: Check framework dir exists (in container)
      ansible.builtin.command: podman exec {{ agent_container }} test -d /opt/open-atomic/opencode
      register: framework_dir
      changed_when: false
      failed_when: false
      become: true
      become_user: "{{ target_user }}"
      become_method: su
      become_flags: "-"

    - name: Assert framework dir is present
      ansible.builtin.assert:
        that: framework_dir.rc == 0
        fail_msg: "Framework dir missing at /opt/open-atomic/opencode (in container)"
        success_msg: "Framework dir present."

    # ── Toolchains (inside the container) ─────────────────────────────────
    - name: Check Node.js version
      ansible.builtin.command: podman exec {{ agent_container }} node --version
      register: node_version
      changed_when: false
      become: true
      become_user: "{{ target_user }}"
      become_method: su
      become_flags: "-"

    - name: Check uv version
      ansible.builtin.command: podman exec {{ agent_container }} uv --version
      register: uv_version
      changed_when: false
      become: true
      become_user: "{{ target_user }}"
      become_method: su
      become_flags: "-"

    - name: Check rustup
      ansible.builtin.command: podman exec {{ agent_container }} rustup --version
      register: rustup_version
      changed_when: false
      become: true
      become_user: "{{ target_user }}"
      become_method: su
      become_flags: "-"

    - name: Check mise version
      ansible.builtin.command: podman exec {{ agent_container }} mise --version
      register: mise_version
      changed_when: false
      become: true
      become_user: "{{ target_user }}"
      become_method: su
      become_flags: "-"

    # ── SELinux ───────────────────────────────────────────────────────────
    - name: Check SELinux status
      ansible.builtin.command: getenforce
      register: selinux_status
      changed_when: false
      become: true

    - name: Assert SELinux is enforcing
      ansible.builtin.assert:
        that: selinux_status.stdout == "Enforcing"
        fail_msg: "SELinux is NOT enforcing ({{ selinux_status.stdout }}). This is a security regression."
        success_msg: "SELinux is Enforcing."

    # ── firewalld ─────────────────────────────────────────────────────────
    - name: Check firewalld status
      ansible.builtin.systemd:
        name: firewalld
      register: firewalld_status
      become: true

    - name: Assert firewalld is active
      ansible.builtin.assert:
        that: firewalld_status.status.ActiveState == "active"
        fail_msg: "firewalld is not running."
        success_msg: "firewalld is active."

    # ── No sudo for the devbox user ───────────────────────────────────────
    - name: Assert devbox user has no sudo
      ansible.builtin.command: sudo -n true
      register: sudo_check
      changed_when: false
      failed_when: false
      become: true
      become_user: "{{ target_user }}"
      become_method: su
      become_flags: "-"

    - name: Verify sudo is unavailable
      ansible.builtin.assert:
        that: sudo_check.rc != 0
        fail_msg: "devbox user has sudo access — security regression"
        success_msg: "devbox user has no sudo (correct)."

    # ── DEVBOX_INSTALLED.md ───────────────────────────────────────────────
    - name: Check DEVBOX_INSTALLED.md exists
      ansible.builtin.stat:
        path: "{{ target_user_home }}/DEVBOX_INSTALLED.md"
      register: devbox_installed

    # ── Summary ───────────────────────────────────────────────────────────
    - name: Validation summary
      ansible.builtin.debug:
        msg: |
          ── open-atomic validation summary ──
          bootc         : {{ bootc_status.stdout_lines[0] | default('unknown') }}
          Podman        : {{ podman_version.stdout }}
          SELinux       : {{ selinux_status.stdout }}
          firewalld     : {{ firewalld_status.status.ActiveState }}
          OpenCode      : {{ opencode_version.stdout | default('not found') }}
          Managed cfg   : {{ 'present' if managed_config.rc == 0 else 'MISSING' }}
          Framework dir : {{ 'present' if framework_dir.rc == 0 else 'MISSING' }}
          Agent container: {{ agent_container_status.stdout | default('not running') }}
          Node.js       : {{ node_version.stdout | default('not found') }}
          uv            : {{ uv_version.stdout | default('not found') }}
          rustup        : {{ rustup_version.stdout | default('not found') }}
          mise          : {{ mise_version.stdout | default('not found') }}
          DEVBOX_INSTALLED.md : {{ 'present' if devbox_installed.stat.exists else 'MISSING' }}
