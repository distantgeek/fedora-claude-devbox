---
# Post-deployment validation for open-atomic.
# Verifies the devbox is correctly configured after make deploy.
#
# Usage: make validate VM_HOST=192.168.x.x

- name: Validate open-atomic deployment
  hosts: all
  gather_facts: true

  vars:
    target_user: "{{ ansible_user | default('devbox') }}"
    target_user_home: "/home/{{ target_user }}"

  tasks:
    # ── bootc ──────────────────────────────────────────────────────────────
    - name: Check bootc status
      ansible.builtin.command: bootc status
      register: bootc_status
      changed_when: false
      become: true

    - name: Display bootc status
      ansible.builtin.debug:
        msg: "{{ bootc_status.stdout_lines[:5] }}"

    # ── Podman ────────────────────────────────────────────────────────────
    - name: Check Podman version
      ansible.builtin.command: podman --version
      register: podman_version
      changed_when: false

    - name: Verify rootless Podman SELinux status
      ansible.builtin.command: podman info --format '{{ "{{" }}.Host.Security.SELinuxEnabled{{ "}}" }}'
      register: podman_selinux
      changed_when: false

    # ── OpenCode ──────────────────────────────────────────────────────────
    - name: Check OpenCode version
      ansible.builtin.shell: |
        source ~/.bashrc && opencode --version
      args:
        executable: /bin/bash
      register: opencode_version
      changed_when: false

    # ── Framework (immutable layers) ──────────────────────────────────────
    - name: Check managed config exists
      ansible.builtin.stat:
        path: /etc/opencode/opencode.json
      register: managed_config
      become: true

    - name: Assert managed config is present
      ansible.builtin.assert:
        that: managed_config.stat.exists
        fail_msg: "Managed config missing at /etc/opencode/opencode.json"
        success_msg: "Managed config present."

    - name: Check framework dir exists
      ansible.builtin.stat:
        path: /opt/open-atomic/opencode
      register: framework_dir
      become: true

    - name: Assert framework dir is present
      ansible.builtin.assert:
        that: framework_dir.stat.exists
        fail_msg: "Framework dir missing at /opt/open-atomic/opencode"
        success_msg: "Framework dir present."

    # ── Node / fnm ────────────────────────────────────────────────────────
    - name: Check Node.js version
      ansible.builtin.shell: |
        export FNM_DIR=/usr/local/share/fnm
        export PATH="$FNM_DIR:$PATH"
        eval "$(fnm env)"
        node --version
      args:
        executable: /bin/bash
      register: node_version
      changed_when: false

    # ── uv ────────────────────────────────────────────────────────────────
    - name: Check uv version
      ansible.builtin.command: uv --version
      register: uv_version
      changed_when: false
      environment:
        PATH: "{{ target_user_home }}/.cargo/bin:{{ ansible_env.PATH }}"

    # ── rustup ────────────────────────────────────────────────────────────
    - name: Check rustup
      ansible.builtin.command: rustup --version
      register: rustup_version
      changed_when: false
      environment:
        PATH: "{{ target_user_home }}/.cargo/bin:{{ ansible_env.PATH }}"

    # ── mise ──────────────────────────────────────────────────────────────
    - name: Check mise version
      ansible.builtin.command: mise --version
      register: mise_version
      changed_when: false
      environment:
        PATH: "{{ target_user_home }}/.local/bin:{{ ansible_env.PATH }}"

    # ── SELinux ───────────────────────────────────────────────────────────
    - name: Check SELinux status
      ansible.builtin.command: getenforce
      register: selinux_status
      changed_when: false
      become: true

    - name: Assert SELinux is enforcing
      ansible.builtin.assert:
        that: selinux_status.stdout == "Enforcing"
        fail_msg: "SELinux is NOT enforcing ({{ selinux_status.stdout }}). This is a security regression."
        success_msg: "SELinux is Enforcing."

    # ── firewalld ─────────────────────────────────────────────────────────
    - name: Check firewalld status
      ansible.builtin.systemd:
        name: firewalld
      register: firewalld_status
      become: true

    - name: Assert firewalld is active
      ansible.builtin.assert:
        that: firewalld_status.status.ActiveState == "active"
        fail_msg: "firewalld is not running."
        success_msg: "firewalld is active."

    # ── No sudo for the devbox user ───────────────────────────────────────
    - name: Assert devbox user has no sudo
      ansible.builtin.command: sudo -n true
      register: sudo_check
      changed_when: false
      failed_when: false

    - name: Verify sudo is unavailable
      ansible.builtin.assert:
        that: sudo_check.rc != 0
        fail_msg: "devbox user has sudo access — security regression"
        success_msg: "devbox user has no sudo (correct)."

    # ── Agent container ───────────────────────────────────────────────────
    - name: Check agent container is running
      ansible.builtin.command: podman ps --filter name=opencode-agent --format '{{ "{{" }}.Status{{ "}}" }}'
      register: agent_container
      changed_when: false

    # ── DEVBOX_INSTALLED.md ───────────────────────────────────────────────
    - name: Check DEVBOX_INSTALLED.md exists
      ansible.builtin.stat:
        path: "{{ target_user_home }}/DEVBOX_INSTALLED.md"
      register: devbox_installed

    # ── Summary ───────────────────────────────────────────────────────────
    - name: Validation summary
      ansible.builtin.debug:
        msg: |
          ── open-atomic validation summary ──
          bootc         : {{ bootc_status.stdout_lines[0] | default('unknown') }}
          Podman        : {{ podman_version.stdout }}
          SELinux       : {{ selinux_status.stdout }}
          firewalld     : {{ firewalld_status.status.ActiveState }}
          OpenCode      : {{ opencode_version.stdout | default('not found') }}
          Managed cfg   : {{ 'present' if managed_config.stat.exists else 'MISSING' }}
          Framework dir : {{ 'present' if framework_dir.stat.exists else 'MISSING' }}
          Agent container: {{ agent_container.stdout | default('not running') }}
          Node.js       : {{ node_version.stdout | default('not found') }}
          uv            : {{ uv_version.stdout | default('not found') }}
          rustup        : {{ rustup_version.stdout | default('not found') }}
          mise          : {{ mise_version.stdout | default('not found') }}
          DEVBOX_INSTALLED.md : {{ 'present' if devbox_installed.stat.exists else 'MISSING' }}
