---
- name: Ensure ~/.claude directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0755"
  loop:
    - "{{ target_user_home }}/.claude"
    - "{{ target_user_home }}/.claude/hooks"
    - "{{ target_user_home }}/.claude/hooks/pre_tool_use"
    - "{{ target_user_home }}/.claude/hooks/post_tool_use"
    - "{{ target_user_home }}/.claude/hooks/lib"

- name: Deploy hook suite
  ansible.builtin.copy:
    src: "{{ repo_root }}/hooks/"
    dest: "{{ target_user_home }}/.claude/hooks/"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: preserve

- name: Ensure hook scripts are executable
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0755"
  loop:
    - "{{ target_user_home }}/.claude/hooks/pre_tool_use/enforce_permissions.py"
    - "{{ target_user_home }}/.claude/hooks/post_tool_use/scrub_output.py"

- name: Deploy settings.json
  ansible.builtin.copy:
    src: "{{ repo_root }}/config/settings.json"
    dest: "{{ target_user_home }}/.claude/settings.json"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0644"
    backup: true

- name: Deploy full CLAUDE.md (project context doc)
  ansible.builtin.copy:
    src: "{{ repo_root }}/CLAUDE.md"
    dest: "{{ target_user_home }}/.claude/CLAUDE.md"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0644"
    backup: true

- name: Deploy tier runtime context
  ansible.builtin.template:
    src: "CLAUDE.{{ devbox_tier }}.md.j2"
    dest: "{{ target_user_home }}/.claude/CLAUDE.runtime.md"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0644"

- name: Deploy MCP server config (enhanced/full tiers)
  when: devbox_tier in ['enhanced', 'full']
  block:
    - name: Ensure ~/.claude MCP config dir exists
      ansible.builtin.file:
        path: "{{ target_user_home }}/.claude"
        state: directory
        mode: "0755"

    - name: Template MCP server config
      ansible.builtin.template:
        src: mcp-servers.json.j2
        dest: "{{ target_user_home }}/.claude/claude_desktop_config.json"
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: "0600"
        backup: true
      vars:
        include_brave: "{{ brave_api_key != '' }}"
        include_context7: "{{ upstash_redis_rest_url != '' and upstash_redis_rest_token != '' }}"
        include_omnisearch: "{{ tavily_api_key != '' }}"

    - name: Mark MCP servers as deployed
      ansible.builtin.set_fact:
        mcp_servers_deployed: true

- name: Wire Proxmox token sourcing in .bashrc (if not already present)
  ansible.builtin.blockinfile:
    path: "{{ target_user_home }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED — proxmox token"
    block: |
      if [ -f "$HOME/.config/proxmox/token" ]; then
          set -a
          source "$HOME/.config/proxmox/token"
          set +a
      fi
    create: false

- name: Display claude-config summary
  ansible.builtin.debug:
    msg: |
      ── claude-config deployed ──
      Tier         : {{ devbox_tier }}
      MCP servers  : {{ mcp_servers_deployed }}
      Settings     : {{ target_user_home }}/.claude/settings.json
      CLAUDE.md    : {{ target_user_home }}/.claude/CLAUDE.md
      Runtime ctx  : {{ target_user_home }}/.claude/CLAUDE.runtime.md
