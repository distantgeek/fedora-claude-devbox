---
# open-atomic — OpenCode agent container runtime state.
# The security framework (plugins, agents, skills, instructions, commands) is
# baked into the agent container image. The agent Quadlet is baked into the VM
# image (/etc/skel). This role handles runtime user state only.

- name: Ensure session cert directory exists
  ansible.builtin.file:
    path: "{{ target_user_home }}/.config/opencode/sessions"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0700"

- name: Ensure OpenCode data dir exists (auth.json, db — persistent volume)
  ansible.builtin.file:
    path: "{{ target_user_home }}/.local/share/opencode"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0700"

- name: Ensure credentials config dir exists (agent.env, targets.conf)
  ansible.builtin.file:
    path: "{{ target_user_home }}/.config/open-atomic"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0700"

- name: Seed agent.env from example (if not present)
  ansible.builtin.copy:
    src: "{{ target_user_home }}/.config/open-atomic/agent.env.example"
    dest: "{{ target_user_home }}/.config/open-atomic/agent.env"
    remote_src: true
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0600"
    force: false

- name: Ensure agent container config dir exists
  ansible.builtin.file:
    path: "{{ target_user_home }}/.config/containers/systemd"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0755"

# User-state steps below (podman pull, systemctl --user) must run AS the target
# user, not as root. When deploying as root (VM_USER=root TARGET_USER=kevbot),
# they are skipped and performed manually — see docs/CREDENTIALS.md.

- name: Pull agent container image
  ansible.builtin.command: podman pull {{ agent_image }}
  changed_when: false
  when: ansible_user == target_user

- name: Reload user systemd units
  ansible.builtin.systemd:
    name: opencode-agent.service
    state: started
    enabled: true
    scope: user
  when: ansible_user == target_user

- name: Note user-state steps for root deploys
  ansible.builtin.debug:
    msg: |
      Running as root — user-state steps skipped. Run as {{ target_user }} (or manually):
        podman pull {{ agent_image }}
        systemctl --user enable --now opencode-agent.service
  when: ansible_user != target_user

- name: Wire Proxmox token sourcing in .bashrc (if not already present)
  ansible.builtin.blockinfile:
    path: "{{ target_user_home }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED — proxmox token"
    block: |
      if [ -f "$HOME/.config/proxmox/token" ]; then
          set -a
          source "$HOME/.config/proxmox/token"
          set +a
      fi
    create: false

- name: Display opencode-config summary
  ansible.builtin.debug:
    msg: |
      ── opencode-config deployed ──
      Agent image  : {{ agent_image }}
      Session dir  : {{ target_user_home }}/.config/opencode/sessions
      Framework    : baked into agent image (immutable)
